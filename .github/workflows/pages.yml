name: Deploy docs site

on:
  push:
    branches: [main]
    # No paths filter. A filter here strands the very first deploy: until Pages
    # is switched to the "GitHub Actions" source in repo settings, deploy-pages
    # cannot publish, and afterwards nothing retriggers it while site/ is
    # unchanged. Deploying a static folder on every push to main is cheap.
  # Allows a redeploy without pushing - use this right after enabling Pages.
  workflow_dispatch:

# Pages needs these to publish; the token is otherwise read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than cancel a running one, so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publishing the wrong directory is the failure mode worth catching here:
      # the Next.js app in apps/web is a server app, not a static export, so if
      # it ever reached Pages the result would be a broken site rather than an
      # error. Assert we are shipping the hand-written docs site.
      - name: Verify the docs site is what gets published
        run: |
          test -f site/index.html
          grep -q "styles.css" site/index.html
          test ! -e site/_next

      # Jekyll would otherwise drop any file or folder starting with an
      # underscore. The file is committed; this only guards against its loss.
      - name: Ensure Jekyll processing stays off
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      # The site is plain HTML/CSS/JS - there is nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
