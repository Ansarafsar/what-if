name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Allows a manual redeploy without pushing.
  workflow_dispatch:

# Pages needs these to publish; the token is otherwise read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than cancel a running one, so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site has its entry point
        run: test -f site/index.html

      - uses: actions/configure-pages@v5

      # The site is plain HTML/CSS/JS - there is nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
